[build-system]
requires = ["flit_core >=3.2,<5"]
build-backend = "flit_core.buildapi"

[project]
dynamic = ["version", "description"]
name = "warlock"
readme = "README.md"
authors = [{name = "Brian Waldon", email = "bcwaldon@gmail.com"}]
maintainers = [{name = "Stephen Finucane", email = "stephen@that.guru"}]
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["JSON schema", "JSON patch", "model validation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "jsonschema ~= 4.0",
    "jsonpatch ~= 1.0",
]

[project.optional-dependencies]
test = [
    "pytest ~= 9.0",
    "pytest-cov ~= 7.1",
]

[project.urls]
Homepage = "http://github.com/bcwaldon/warlock"
"Source Code" = "http://github.com/bcwaldon/warlock"

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "preserve"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "G", "I", "LOG", "RUF", "W"]
